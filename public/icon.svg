<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="55%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bg)"/>
  <!-- соединительная линия с двумя поворотами -->
  <polyline
    points="140,330 140,400 400,400 400,180"
    fill="none"
    stroke="url(#line)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <!-- плитка 1 (внизу слева) -->
  <rect x="76" y="266" width="128" height="128" rx="30" fill="url(#tile)" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="140" cy="330" r="34" fill="#ef4444"/>
  <path d="M140 296 q6 -18 26 -22 q-2 20 -26 22" fill="#84cc16"/>
  <!-- плитка 2 (вверху справа) -->
  <rect x="336" y="116" width="128" height="128" rx="30" fill="url(#tile)" stroke="#cbd5e1" stroke-width="4"/>
  <circle cx="400" cy="180" r="34" fill="#ef4444"/>
  <path d="M400 146 q6 -18 26 -22 q-2 20 -26 22" fill="#84cc16"/>
  <!-- точки-соединения -->
  <circle cx="140" cy="330" r="16" fill="#0d9488"/>
  <circle cx="400" cy="180" r="16" fill="#f59e0b"/>
</svg>
